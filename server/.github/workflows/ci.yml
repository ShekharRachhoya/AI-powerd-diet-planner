name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - 22

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses:
          actions/setup-node@v4
        with:
          node-version:
            ${{ matrix.node-version }}

      - name:
          Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name:
          Upload coverage
        uses:
          actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/