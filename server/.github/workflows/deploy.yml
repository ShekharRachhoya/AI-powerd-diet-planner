name: Deploy

on:
  workflow_run:
    workflows:
      - Docker
    types:
      - completed

jobs:
  deploy:
    if:
      github.event.workflow_run.conclusion == 'success'

    runs-on:
      ubuntu-latest

    steps:
      - name:
          Deploy Server
        uses:
          appleboy/ssh-action@v1
        with:
          host:
            ${{ secrets.HOST }}
          username:
            ${{ secrets.USERNAME }}
          key:
            ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            cd ai-health-api
            docker compose pull
            docker compose up -d