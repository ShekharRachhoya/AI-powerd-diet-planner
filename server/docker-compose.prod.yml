services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      - mongodb
      - redis

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "docker/healthcheck.js"
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    command:
      node src/workers/index.js

    restart:
      unless-stopped

    env_file:
      - .env

    depends_on:
      - mongodb
      - redis

  mongodb:
    image:
      mongo:8

    restart:
      unless-stopped

    volumes:
      - mongo_data:/data/db

  redis:
    image:
      redis:8-alpine

    restart:
      unless-stopped

    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data: